<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>OneCalc – All-in-One Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f2f5fc;--card:#fff;--tx:#0f1733;--mu:#667090;--ac:#0b5cff;--ac2:#e6eeff;--bd:#e2e8f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1020;--card:#151b34;--tx:#eef1fb;--mu:#98a1c4;--ac:#5b8cff;--ac2:#1f2a54;--bd:#262e55}}
:root[data-theme=dark]{--bg:#0b1020;--card:#151b34;--tx:#eef1fb;--mu:#98a1c4;--ac:#5b8cff;--ac2:#1f2a54;--bd:#262e55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:78px}
.w{max-width:560px;margin:auto;padding:12px 14px}h1{margin:12px 0 8px;font-size:22px}
.hd{background:linear-gradient(135deg,#0b5cff,#0636b8);border-radius:22px;padding:16px;color:#fff;box-shadow:0 8px 24px #0b5cff44}
.br{display:flex;gap:12px;align-items:center;margin-bottom:14px}.logo{width:46px;height:46px;border-radius:14px;background:#fff;color:#0b5cff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.tg{font-size:13px;opacity:.9;margin-top:2px}.hd input{border:0;box-shadow:0 2px 8px #0003}
.sub{color:var(--mu);font-size:13px}
input,select{width:100%;padding:14px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font-size:17px}input:focus,select:focus{outline:none;border-color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px 0 6px;padding-bottom:4px}.chip{flex:none;padding:8px 15px;border-radius:99px;background:var(--card);border:1.5px solid var(--bd);color:var(--tx);font-size:14px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pop{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.pop button{background:none;border:0;color:var(--tx);font-size:13px;font-weight:600}.pop .ic{width:58px;height:58px;font-size:26px;margin:0 auto 6px}
.ic{display:flex;align-items:center;justify-content:center;border-radius:16px;width:46px;height:46px;font-size:22px}
h2{font-size:15px;margin:16px 2px 8px;color:var(--mu)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.t{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;text-align:left;color:var(--tx);font-size:15px;font-weight:700;display:flex;flex-direction:column;gap:8px;min-height:116px;box-shadow:0 2px 8px #1a2a6c0d}.t small{color:var(--mu);font-weight:500;font-size:12px;margin-top:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin:12px 0}label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px;font-weight:600}
.res{background:linear-gradient(135deg,#0b5cff,#0636b8);color:#fff;border:0}.big{font-size:32px;font-weight:800;margin:2px 0 6px}.res .sub{color:#dbe6ff}.row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #ffffff33}.bar{display:flex;height:12px;border-radius:9px;overflow:hidden;margin:12px 0 6px}
button{font:inherit;cursor:pointer}.btn{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:14px 18px;font-weight:700}.ghost{background:var(--ac2);color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}nav button{flex:1;padding:12px 0;background:none;border:0;color:var(--mu);font-size:12px}nav .on{color:var(--ac);font-weight:800}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.k button{padding:20px 0;font-size:23px;border-radius:18px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600}.k .o{background:var(--ac2);color:var(--ac)}.k .e{background:#ff7a1a;color:#fff;border:0}
.disp{text-align:right;font-size:40px;font-weight:700;min-height:52px;word-break:break-all}.ex{color:var(--mu);text-align:right;min-height:22px}
</style></head><body><div class="w" id="app"></div>
<nav><button id="n0" onclick="go(0)">🏠 Home</button><button id="n1" onclick="go(1)">♥ Favorites</button><button id="n2" onclick="go(2)">🕘 History</button><button id="n3" onclick="go(3)">⚙ Settings</button></nav>
<script>
const I=n=>isFinite(n)?Number(n).toLocaleString('en-IN',{maximumFractionDigits:0}):'–',R=n=>'₹'+I(n),D=n=>Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const W=n=>{n=Math.abs(n);return n>=1e7?'₹'+(n/1e7).toFixed(2)+' Crore':n>=1e5?'₹'+(n/1e5).toFixed(2)+' Lakh':R(n)};
const emi=(P,r,n)=>{r/=1200;return r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n};
const loan=(id,n,P,r,y)=>({id,c:'Loan',n,kw:'loan emi karj ghar car',i:[['P','Loan amount ₹',P],['r','Interest % p.a.',r],['y','Tenure (years)',y]],f:o=>{const n=o.y*12,e=emi(o.P,o.r,n),tot=e*n;return{m:['Monthly EMI',R(e)],r:[['Principal',R(o.P)],['Total interest',R(tot-o.P)],['Total payment',R(tot)]],bar:[o.P,tot-o.P]}}});
const sip=(o,step)=>{let i=o.r/1200,v=0,m=o.m,inv=0;for(let y=0;y<o.y;y++){for(let k=0;k<12;k++){v=(v+m)*(1+i);inv+=m}m*=1+(step||0)/100}return[v,inv]};
const U={km:['l',1000],m:['l',1],cm:['l',.01],ft:['l',.3048],inch:['l',.0254],mile:['l',1609.344],kg:['w',1],gram:['w',.001],quintal:['w',100],ton:['w',1000],pound:['w',.4536],'sq ft':['a',.092903],'sq m':['a',1],gaj:['a',.836127],acre:['a',4046.86],hectare:['a',1e4],litre:['v',1],ml:['v',.001],gallon:['v',3.78541]};
const T=[
{id:'basic',c:'Math',n:'Basic Calculator',kw:'jod ghatao calculator',b:1},
{id:'pct',c:'Math',n:'Percentage',kw:'pratishat percent 50000 ka 18',i:[['p','Percent %',18],['v','Of amount',500]],f:o=>({m:['Result',D(o.p*o.v/100)],r:[['Amount + %',D(o.v*(1+o.p/100))],['Amount − %',D(o.v*(1-o.p/100))]]})},
{id:'chg',c:'Math',n:'% Increase / Decrease',kw:'change badhna ghatna',i:[['a','Old value',100],['b','New value',125]],f:o=>({m:['Change',D((o.b-o.a)/o.a*100)+'%'],r:[['Difference',D(o.b-o.a)]]})},
{id:'avg',c:'Math',n:'Average (3 numbers)',kw:'average ausat',i:[['a','Number 1',10],['b','Number 2',20],['c','Number 3',30]],f:o=>({m:['Average',D((o.a+o.b+o.c)/3)],r:[['Sum',D(o.a+o.b+o.c)]]})},
loan('emi','EMI Calculator',1e6,9,20),loan('home','Home Loan EMI',5e6,8.5,20),loan('car','Car Loan EMI',8e5,9.5,5),loan('pl','Personal Loan EMI',3e5,12,3),
{id:'prepay',c:'Loan',n:'Loan Prepayment ⭐',kw:'prepayment part payment interest bachat',i:[['P','Loan amount ₹',1e6],['r','Interest % p.a.',9],['y','Tenure (years)',20],['pp','Prepay amount ₹',1e5]],f:o=>{const n=o.y*12,e=emi(o.P,o.r,n),i=o.r/1200;let b=o.P-o.pp,mo=0,int=0;while(b>0&&mo<1200){const x=b*i;int+=x;b=b+x-e;mo++}const base=e*n-o.P;return{m:['Interest saved',R(base-int)],r:[['Original interest',R(base)],['New interest',R(int)],['Months saved',I(n-mo)],['EMI',R(e)]]}}},
{id:'sip',c:'Invest',n:'SIP Calculator',kw:'sip mutual fund nivesh',i:[['m','Monthly ₹',10000],['r','Return % p.a.',12],['y','Years',10]],f:o=>{const[v,inv]=sip(o);return{m:['Future value',R(v)],r:[['Invested',R(inv)],['Gain',R(v-inv)],['In words',W(v)]],bar:[inv,v-inv]}}},
{id:'step',c:'Invest',n:'Step-up SIP',kw:'step up sip',i:[['m','Monthly ₹',10000],['r','Return % p.a.',12],['y','Years',10],['s','Yearly step-up %',10]],f:o=>{const[v,inv]=sip(o,o.s);return{m:['Future value',R(v)],r:[['Invested',R(inv)],['Gain',R(v-inv)],['In words',W(v)]],bar:[inv,v-inv]}}},
{id:'goal',c:'Invest',n:'Goal Planner (SIP)',kw:'goal lakh crore chahiye 10 saal mein',i:[['g','Target ₹',1e7],['r','Return % p.a.',12],['y','Years',20]],f:o=>{const i=o.r/1200,n=o.y*12,p=o.g*i/((Math.pow(1+i,n)-1)*(1+i));return{m:['Invest monthly',R(p)],r:[['Total invested',R(p*n)],['Goal',W(o.g)]],bar:[p*n,o.g-p*n]}}},
{id:'lump',c:'Invest',n:'Lumpsum',kw:'lumpsum ek saath',i:[['P','Amount ₹',1e5],['r','Return % p.a.',12],['y','Years',10]],f:o=>{const v=o.P*Math.pow(1+o.r/100,o.y);return{m:['Future value',R(v)],r:[['Gain',R(v-o.P)]],bar:[o.P,v-o.P]}}},
{id:'fd',c:'Invest',n:'FD Calculator',kw:'fixed deposit fd',i:[['P','Deposit ₹',1e5],['r','Interest % p.a.',7],['y','Years',5]],f:o=>{const v=o.P*Math.pow(1+o.r/400,4*o.y);return{m:['Maturity',R(v)],r:[['Interest',R(v-o.P)]],bar:[o.P,v-o.P]}}},
{id:'ci',c:'Invest',n:'Compound Interest',kw:'chakravriddhi byaj',i:[['P','Principal ₹',1e5],['r','Rate % p.a.',8],['y','Years',5]],f:o=>{const v=o.P*Math.pow(1+o.r/100,o.y);return{m:['Amount',R(v)],r:[['Interest',R(v-o.P)]],bar:[o.P,v-o.P]}}},
{id:'si',c:'Invest',n:'Simple Interest',kw:'sadharan byaj',i:[['P','Principal ₹',1e5],['r','Rate % p.a.',8],['y','Years',5]],f:o=>{const s=o.P*o.r*o.y/100;return{m:['Interest',R(s)],r:[['Total',R(o.P+s)]]}}},
{id:'cagr',c:'Invest',n:'CAGR',kw:'cagr growth',i:[['a','Start value ₹',1e5],['b','End value ₹',2e5],['y','Years',5]],f:o=>({m:['CAGR',D((Math.pow(o.b/o.a,1/o.y)-1)*100)+'%'],r:[['Gain',R(o.b-o.a)]]})},
{id:'gadd',c:'GST',n:'Add GST',kw:'gst jodna',i:[['a','Amount ₹',1000],['g','GST %',18]],f:o=>({m:['Total',R(o.a*(1+o.g/100))],r:[['GST',D(o.a*o.g/100)],['CGST + SGST (each)',D(o.a*o.g/200)],['IGST',D(o.a*o.g/100)]]})},
{id:'grem',c:'GST',n:'Remove GST',kw:'gst hatana reverse',i:[['a','Amount incl. GST ₹',1180],['g','GST %',18]],f:o=>{const b=o.a/(1+o.g/100);return{m:['Base amount',R(b)],r:[['GST',D(o.a-b)],['CGST + SGST (each)',D((o.a-b)/2)]]}}},
{id:'dgst',c:'GST',n:'Discount + GST',kw:'discount gst shopping',i:[['a','Price ₹',5000],['d','Discount %',20],['g','GST %',18]],f:o=>{const x=o.a*(1-o.d/100);return{m:['Final amount',R(x*(1+o.g/100))],r:[['After discount',R(x)],['You save',R(o.a-x)],['GST',R(x*o.g/100)]]}}},
{id:'pl',c:'GST',n:'Profit / Loss',kw:'munafa nuksan margin markup',i:[['c','Cost price ₹',800],['s','Selling price ₹',1000]],f:o=>({m:[o.s>=o.c?'Profit':'Loss',R(Math.abs(o.s-o.c))],r:[['Margin %',D((o.s-o.c)/o.s*100)+'%'],['Markup %',D((o.s-o.c)/o.c*100)+'%']]})},
{id:'age',c:'Date',n:'Age Calculator',kw:'umar age janm',i:[['d','Date of birth','2000-01-01','date']],f:o=>{const b=new Date(o.d),t=new Date();let y=t.getFullYear()-b.getFullYear(),m=t.getMonth()-b.getMonth(),d=t.getDate()-b.getDate();if(d<0){m--;d+=new Date(t.getFullYear(),t.getMonth(),0).getDate()}if(m<0){y--;m+=12}return{m:['Age',y+' yrs '+m+' mo'],r:[['Days',I(Math.floor((t-b)/864e5))],['Extra days',d]]}}},
{id:'dd',c:'Date',n:'Date Difference',kw:'din tarikh',i:[['a','From','2026-01-01','date'],['b','To','2026-12-31','date']],f:o=>{const n=Math.round((new Date(o.b)-new Date(o.a))/864e5);return{m:['Days',I(n)],r:[['Weeks',D(n/7)],['Approx. months',D(n/30.44)]]}}},
{id:'unit',c:'Units',n:'Unit Converter',kw:'converter length weight area gaj acre',i:[['v','Value',1],['f','From','acre','sel'],['t','To','sq ft','sel']],f:o=>{const a=U[o.f],b=U[o.t];if(a[0]!=b[0])return{m:['Mismatch','Same type chuniye'],r:[]};return{m:['Result',D(o.v*a[1]/b[1])+' '+o.t],r:[]}}}
];
const cats=['All','Math','Loan','Invest','GST','Date','Units'];
let S={tab:0,q:'',cat:'All',tool:null,v:{}},fav=[],hist=[],bx='';
try{fav=JSON.parse(localStorage.getItem('cf')||'[]');hist=JSON.parse(localStorage.getItem('ch')||'[]');const th=localStorage.getItem('ct');if(th)document.documentElement.dataset.theme=th}catch(e){}
const sv=()=>{try{localStorage.setItem('cf',JSON.stringify(fav));localStorage.setItem('ch',JSON.stringify(hist.slice(0,50)))}catch(e){}};
const $=id=>document.getElementById(id);
function go(t){S.tab=t;S.tool=null;draw()}
function openTool(id){S.tool=T.find(x=>x.id==id);S.v={};(S.tool.i||[]).forEach(a=>S.v[a[0]]=a[2]);draw()}
const CI={Math:'🧮',Loan:'🏦',Invest:'📈',GST:'🧾',Date:'📅',Units:'📏'},CC={Math:'#e6eeff',Loan:'#e0f4ff',Invest:'#e3f7e9',GST:'#fff0dd',Date:'#f1e6ff',Units:'#ffe8ee'};
function tiles(l){return l.length?'<div class="g">'+l.map(t=>`<button class="t" onclick="openTool('${t.id}')"><span class="ic" style="background:${CC[t.c]}">${CI[t.c]}</span>${t.n}<small>${t.c}</small></button>`).join('')+'</div>':'<p class="sub">Kuch nahi mila</p>'}
function pop(){return '<h2>Popular</h2><div class="pop">'+[['emi','EMI','Loan'],['sip','SIP','Invest'],['gadd','GST','GST'],['basic','Calc','Math']].map(x=>`<button onclick="openTool('${x[0]}')"><div class="ic" style="background:${CC[x[2]]}">${CI[x[2]]}</div>${x[1]}</button>`).join('')+'</div>'}
function draw(){[0,1,2,3].forEach(i=>$('n'+i).className=S.tab==i&&!S.tool?'on':'');const a=$('app');
if(S.tool)return tool(a);
if(S.tab==0){const q=S.q.toLowerCase(),l=T.filter(t=>(S.cat=='All'||t.c==S.cat)&&(!q||(t.n+t.kw+t.c).toLowerCase().includes(q)));
a.innerHTML=`<div class="hd"><div class="br"><div class="logo">1</div><div><b style="font-size:23px">OneCalc</b><div class="tg">Everything You Need to Calculate</div></div></div><input id="q" placeholder="🔍 EMI, SIP, GST, ghar ki EMI…" value="${S.q}" oninput="S.q=this.value;draw();const e=$('q');e.focus();e.setSelectionRange(99,99)"></div><div class="chips">${cats.map(c=>`<button class="chip ${S.cat==c?'on':''}" onclick="S.cat='${c}';draw()">${c}</button>`).join('')}</div>${S.q||S.cat!='All'?'':pop()}<h2>${S.q||S.cat!='All'?'Results':'All calculators'}</h2>${tiles(l)}`}
else if(S.tab==1){a.innerHTML='<h1>Favorites</h1>'+(fav.length?tiles(T.filter(t=>fav.includes(t.id))):'<p class="sub">Calculator ke andar ♡ dabakar add karein.</p>')}
else if(S.tab==2){a.innerHTML='<h1>History</h1>'+(hist.length?hist.map(h=>`<div class="card"><b>${h.n}</b><div class="big" style="font-size:20px">${h.v}</div><div class="sub">${h.t}</div></div>`).join('')+'<button class="btn ghost" onclick="hist=[];sv();draw()">Clear</button>':'<p class="sub">Abhi koi calculation nahi. Data sirf aapke device par rehta hai.</p>')}
else a.innerHTML='<h1>Settings</h1><div class="card"><label>Theme</label><div class="g"><button class="btn ghost" onclick="th(\'light\')">Light</button><button class="btn ghost" onclick="th(\'dark\')">Dark</button></div></div><div class="card sub">OneCalc v1 · No login · No cloud · Aapka data device par hi rehta hai.<br>Tax/GST rates verify karke use karein.</div>'}
function th(x){document.documentElement.dataset.theme=x;try{localStorage.setItem('ct',x)}catch(e){}}
function tool(a){const t=S.tool,h=`<button class="chip" onclick="S.tool=null;draw()">← Back</button> <button class="chip" onclick="tf('${t.id}')">${fav.includes(t.id)?'♥':'♡'} Favorite</button><h1>${t.n}</h1>`;
if(t.b){a.innerHTML=h+`<div class="card"><div class="ex" id="ex"></div><div class="disp" id="dp">0</div></div><div class="k">${['AC','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','00','0','.','='].map(k=>`<button class="${'÷×−+'.includes(k)?'o':k=='='?'e':''}" onclick="key('${k}')">${k}</button>`).join('')}</div>`;bx='';return}
a.innerHTML=h+`<div class="card" id="in">${t.i.map(x=>`<label>${x[1]}</label>`+(x[3]=='sel'?`<select onchange="S.v['${x[0]}']=this.value;res()">${Object.keys(U).map(u=>`<option ${S.v[x[0]]==u?'selected':''}>${u}</option>`).join('')}</select>`:`<input type="${x[3]||'number'}" inputmode="decimal" value="${S.v[x[0]]}" oninput="S.v['${x[0]}']=this.value;res()">`)).join('')}</div><div id="out"></div>`;res()}
function tf(id){fav=fav.includes(id)?fav.filter(x=>x!=id):[...fav,id];sv();draw()}
function res(){const t=S.tool,o={};t.i.forEach(x=>o[x[0]]=x[3]?S.v[x[0]]:parseFloat(S.v[x[0]])||0);let r;try{r=t.f(o)}catch(e){r={m:['Error','–'],r:[]}}
S.last=t.n+'\n'+t.i.map(x=>x[1]+': '+S.v[x[0]]).join('\n')+'\n'+r.m[0]+': '+r.m[1];
$('out').innerHTML=`<div class="card res"><div class="sub">${r.m[0]}</div><div class="big">${r.m[1]}</div>${r.bar?`<div class="bar"><span style="flex:${Math.max(r.bar[0],0)};background:#fff"></span><span style="flex:${Math.max(r.bar[1],0)};background:#ffb347"></span></div><div class="sub">⚪ Principal / invested &nbsp; 🟠 Interest / gain</div>`:''}${r.r.map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><button class="btn" onclick="sh()">📤 Share</button> <button class="btn ghost" onclick="sv2('${r.m[1].replace(/'/g,'')}')">Save to history</button>`}
function sv2(v){hist.unshift({n:S.tool.n,v,t:new Date().toLocaleString('en-IN')});sv();alert('History me save ho gaya')}
function sh(){const x='OneCalc – '+S.last;if(navigator.share)navigator.share({text:x}).catch(()=>{});else try{navigator.clipboard.writeText(x);alert('Copied')}catch(e){}}
function key(k){if(k=='AC')bx='';else if(k=='⌫')bx=bx.slice(0,-1);else if(k=='='){try{const e=bx.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/(\d+\.?\d*)%/g,'($1/100)');if(/[^0-9+\-*\/().\s]/.test(e))throw 0;const v=Function('"use strict";return ('+e+')')();$('ex').textContent=bx+' =';hist.unshift({n:'Basic',v:D(v),t:bx});sv();bx=String(+v.toFixed(10))}catch(e){bx='';$('ex').textContent='Error'}}else bx+=k;$('dp').textContent=bx?bx.replace(/\d+(\.\d+)?/g,m=>m.length>3&&!m.includes('.')?Number(m).toLocaleString('en-IN'):m):'0'}
draw();
</script></body></html>
