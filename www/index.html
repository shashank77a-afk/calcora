$('out').innerHTML=`<div class="card res"><div class="sub">${r.m[0]}</div><div class="big">${r.m[1]}</div>${r.bar?`<div class="bar"><span style="flex:${Math.max(r.bar[0],0)};background:#fff"></span><span style="flex:${Math.max(r.bar[1],0)};background:#ffb347"></span></div><div class="sub">⚪ Principal / invested &nbsp; 🟠 Interest / gain</div>`:''}${r.r.map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><button class="btn" onclick="sh()">📤 Share</button> <button class="btn ghost" onclick="sv2('${r.m[1].replace(/'/g,'')}')">Save to history</button>`}
function sv2(v){hist.unshift({n:S.tool.n,v,t:new Date().toLocaleString('en-IN')});sv();alert('History me save ho gaya')}
function sh(){const x='OneCalc – '+S.last;if(navigator.share)navigator.share({text:x}).catch(()=>{});else try{navigator.clipboard.writeText(x);alert('Copied')}catch(e){}}
function key(k){if(k=='AC')bx='';else if(k=='⌫')bx=bx.slice(0,-1);else if(k=='='){try{const e=bx.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/(\d+\.?\d*)%/g,'($1/100)');if(/[^0-9+\-*\/().\s]/.test(e))throw 0;const v=Function('"use strict";return ('+e+')')();$('ex').textContent=bx+' =';hist.unshift({n:'Basic',v:D(v),t:bx});sv();bx=String(+v.toFixed(10))}catch(e){bx='';$('ex').textContent='Error'}}else bx+=k;$('dp').textContent=bx?bx.replace(/\d+(\.\d+)?/g,m=>m.length>3&&!m.includes('.')?Number(m).toLocaleString('en-IN'):m):'0'}
history.replaceState({tab:0},'');addEventListener('popstate',e=>{const q=e.state||{tab:0};S.tab=q.tab||0;if(q.tool)openTool(q.tool,1);else{S.tool=null;draw()}});
draw();
