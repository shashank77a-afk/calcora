name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install && npm install @capacitor/app@6 @capacitor-community/admob@6
      - run: npx cap add android
      - name: AdMob app id
        run: sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-4977912781671426~3113296143\"/></application>#" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Icon and splash
        run: |
          cp -r resicons/mipmap-* android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          find android/app/src/main/res -name splash.png -exec cp resicons/splash.png {} \;
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OneCalc-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk